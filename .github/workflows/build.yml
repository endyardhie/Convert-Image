name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pil python3-reportlab python3-pypdf libavif-bin
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_installer.py --check
      - run: bash -n install-image.sh install-img2avif.sh uninstall.sh
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test, build and verify installer
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Convert-Image-Windows-x64
          path: dist/*-Setup.exe
          if-no-files-found: error
      - name: Save installer checksum
        shell: pwsh
        run: Get-FileHash dist/*-Setup.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Convert-Image-Windows-checksums
          path: dist/SHA256SUMS.txt
